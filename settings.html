<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Z·SHIFT</title>
    <style>
      html, body { background: #0a0a0c; }
      #splash {
        position: fixed; inset: 0; z-index: 999;
        background: #0a0a0c;
        display: flex; align-items: center; justify-content: center;
        transition: opacity .18s ease;
      }
      #splash img {
        width: 72px; height: 72px;
        animation: splash-pulse 1.6s ease-in-out infinite;
      }
      @keyframes splash-pulse { 50% { opacity: .5; } }
      @media (prefers-reduced-motion: reduce) {
        #splash img { animation: none; }
        #splash { transition: none; }
      }
    </style>
    <!-- 普通 link：dev 下 vite 会重写为模块注入（media 技巧会破坏该转换）；prod 为本地文件秒到 -->
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg">
  </head>
  <body class="settings-win">
    <div id="app"></div>
    <div id="splash" aria-label="Z·SHIFT"><span style="font:600 20px Segoe UI,sans-serif;color:#63dcc0;letter-spacing:.04em">Z·SHIFT</span></div>
    <script type="module" src="/src/settings.js"></script>
  </body>
</html>
